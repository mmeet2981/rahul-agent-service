services:

  redis:
    image: redis:7-alpine
    container_name: agent-service-redis
    restart: unless-stopped
    env_file:
      - .env.prod
    command: redis-server --appendonly yes --databases 16
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2022-04-29T01-27-09Z
    container_name: agent-service-minio
    restart: unless-stopped
    env_file:
      - .env.prod

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  email-service:
    image: rahulaiservices.azurecr.io/email-service:latest
    container_name: agent-service-email-service
    restart: unless-stopped

    env_file:
      - .env.prod
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      - APP_DB_HOST=${DB_HOST}
      - APP_DB_PORT=${DB_PORT}
      - APP_DB_UNAME=${DB_USER}
      - APP_DB_PASS=${DB_PASS}
      - APP_DB_NAME=${DB_NAME}
      - EMAIL_BUCKET=email-attachments
    depends_on:
      minio:
        condition: service_healthy

  whatsapp-service:
    image: rahulaiservices.azurecr.io/whatsapp-service:latest
    container_name: agent-service-whatsapp-service
    restart: unless-stopped
    ports:
      - "${WHATSAPP_PORT:-8077}:${WHATSAPP_PORT:-8077}"
    env_file:
      - .env.prod
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_WHATSAPP_BUCKET=whatsapp-attachments
      - WHATSAPP_PORT=${WHATSAPP_PORT:-8077}
      - BACKEND_HOST=${BACKEND_HOST}
      - AGENT_HOST=http://app:${PORT:-3044}
      - ALLOWED_GROUP_IDS=${ALLOWED_GROUP_IDS}
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
    depends_on:
      minio:
        condition: service_healthy

  app:
    image: rahulaiservices.azurecr.io/app:latest
    container_name: agent-service-app
    restart: unless-stopped
    ports:
      - "${PORT:-3030}:${PORT:-3030}"
    env_file:
      - .env.prod
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    command: sh -c "yoyo apply --batch -d postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require && python main.py"
    depends_on:
      redis:
        condition: service_healthy

  llm-worker:
    image: rahulaiservices.azurecr.io/llm-worker:latest
    container_name: agent-service-llm-worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    command: python -m src.workers.llm_worker
    depends_on:
      redis:
        condition: service_healthy

  ocr-worker:
    image: rahulaiservices.azurecr.io/ocr-worker:latest
    container_name: agent-service-ocr-worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    command: python -m src.workers.ocr_worker
    depends_on:
      redis:
        condition: service_healthy

  so-worker:
    image: rahulaiservices.azurecr.io/so-worker:latest
    container_name: agent-service-so-worker
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    command: python -m src.workers.so_worker
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  minio_data:
  whatsapp_auth:
