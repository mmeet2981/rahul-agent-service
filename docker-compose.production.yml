services:

  redis:
    image: redis:7-alpine
    container_name: agent-service-redis
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --appendonly yes --databases 16
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2022-04-29T01-27-09Z
    container_name: agent-service-minio
    restart: unless-stopped
    env_file:
      - .env

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: gateway azure
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  email-service:
    build:
      context: ./email-service
    container_name: agent-service-email-service
    restart: unless-stopped

    env_file:
      - .env
    dns:
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      - APP_DB_HOST=${DB_HOST}
      - APP_DB_PORT=${DB_PORT}
      - APP_DB_UNAME=${DB_USER}
      - APP_DB_PASS=${DB_PASS}
      - APP_DB_NAME=${DB_NAME}
      - EMAIL_BUCKET=email-attachments
    depends_on:
      minio:
        condition: service_healthy

  whatsapp-service:
    build:
      context: ./whatsapp-service
    container_name: agent-service-whatsapp-service
    restart: unless-stopped

    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_WHATSAPP_BUCKET=whatsapp-attachments
    depends_on:
      minio:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-service-app
    restart: unless-stopped
    ports:
      - "${PORT:-3030}:${PORT:-3030}"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    command: sh -c "yoyo apply --batch -d postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require && python main.py"
    depends_on:
      redis:
        condition: service_healthy

  llm-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-service-llm-worker
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    command: python -m src.workers.llm_worker
    depends_on:
      redis:
        condition: service_healthy

  ocr-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-service-ocr-worker
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    command: python -m src.workers.ocr_worker
    depends_on:
      redis:
        condition: service_healthy

  so-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-service-so-worker
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    command: python -m src.workers.so_worker
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  minio_data:
